// Release signing stays off the repo. To sign a build, set:
//   WIN10_KEYSTORE, WIN10_KEYSTORE_PASSWORD
//   optional: WIN10_KEY_ALIAS (default win10), WIN10_KEY_PASSWORD
def keystorePath = System.getenv("WIN10_KEYSTORE")
def keystorePassword = System.getenv("WIN10_KEYSTORE_PASSWORD")
def keyAliasName = System.getenv("WIN10_KEY_ALIAS") ?: "win10"
def keyPassword = System.getenv("WIN10_KEY_PASSWORD") ?: keystorePassword
def canSign = keystorePath && keystorePassword && file(keystorePath).exists()

android {
    namespace = "com.wilson.win10launcher"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.wilson.win10launcher"
        minSdk = 26
        targetSdk = 34
        versionCode = 48
        versionName = "2.37"
    }

    if (canSign) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (canSign) {
                signingConfig signingConfigs.release
            }
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

